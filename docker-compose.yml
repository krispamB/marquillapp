# Local infrastructure for the whole monorepo.
#
#   docker compose up -d                 MongoDB, Redis, BullMQ dashboard, MinIO (S3 storage
#                                        in place of Cloudflare R2) and Browserless (headless
#                                        Chromium in place of Browserless.io) (default)
#   docker compose --profile app up -d   ...plus the API and worker built from apps/api/Dockerfile
#
# MinIO: S3 API on :9000, console on :9001 (minioadmin / minioadmin). `minio-init`
# creates the marquill-local bucket and exits. Browserless: :3002 (host ports 3000
# and 3001 belong to web and landing), token local-browserless-token.
# apps/api/.env.example already points at both. Credentials here are local only.
#
# MinIO no longer publishes images under minio/minio, so the image is a community
# rebuild of the last upstream release; it also ships the mc client used by minio-init.
#
# The project name stays "linkgenserver" so existing local volumes
# (linkgenserver_mongo_data, linkgenserver_redis_data) keep their data.
name: linkgenserver

services:
  redis:
    image: redis:7.4-alpine
    container_name: redis_local
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes", "--requirepass", "securelinkgenpass", "--maxmemory-policy", "noeviction", "--protected-mode", "no" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "securelinkgenpass", "PING" ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:latest
    container_name: mongodb_local
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  bullboard:
    image: venatum/bull-board
    container_name: bullmq_dashboard
    ports:
      - "8080:3000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: securelinkgenpass
      BULL_PREFIX: bull
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: minio_local
    command: [ "server", "/data", "--console-address", ":9001" ]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: minio_init
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - >-
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/marquill-local
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  browserless:
    image: ghcr.io/browserless/chromium:v2.38.1
    container_name: browserless_local
    ports:
      - "3002:3000"
    environment:
      TOKEN: local-browserless-token
      CONCURRENT: 4
      QUEUED: 10
      TIMEOUT: 120000
    restart: unless-stopped

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: marquill-api
    env_file: apps/api/.env
    environment: &app_env
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/linkgenserver?directConnection=true
      REDIS_URL: redis://default:securelinkgenpass@redis:6379
      R2_ENDPOINT: http://minio:9000
      BROWSERLESS_URL: http://browserless:3000
    ports:
      - "3500:3500"
    depends_on: &app_deps
      redis:
        condition: service_healthy
      mongo:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      browserless:
        condition: service_started

  worker:
    profiles: ["app"]
    image: marquill-api
    command: ["node", "dist/workflow/workers/workflow.worker.js"]
    # Matches the Railway drain window: the worker lets running jobs finish.
    stop_grace_period: 130s
    env_file: apps/api/.env
    environment: *app_env
    depends_on:
      <<: *app_deps
      api:
        condition: service_started

volumes:
  redis_data:
  mongo_data:
  minio_data:
