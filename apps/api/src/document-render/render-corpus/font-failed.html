<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- A face whose file 404s on an allowed host: what a Google Fonts outage
     looks like. The failure is reported once; the fallbacks it causes are its
     symptoms and are not. -->
<style>
@font-face { font-family: 'Broken Face'; src: url(https://fonts.gstatic.com/s/brokenface/v1/missing.woff2) format('woff2'); }
:root { --ds-white: #ffffff; --ds-ink: #0a0a0a; --ds-grey: #6e6e6e; --ds-hairline: #e2e2e2; }
.leaf { height: 100%; color: var(--ds-ink); font-family: 'Inter Tight', -apple-system, 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; }
.title { font-size: 72px; line-height: 1.05; letter-spacing: -0.035em; font-weight: 500; margin: 0; }
.broken { font-family: 'Broken Face', 'Helvetica Neue', sans-serif; }
</style>
</head>
<body>
<section class="page" data-role="title">
  <div class="leaf">
    <h1 class="title broken">Three fixes for carousels people finish.</h1>
  </div>
</section>
<section class="page" data-role="end">
  <div class="leaf">
    <h1 class="title">Save this for the next one.</h1>
  </div>
</section>
</body>
</html>
