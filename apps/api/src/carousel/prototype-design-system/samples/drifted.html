<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap">
<style>
.page {
  width: 1080px;
  height: 1920px;
  padding: 37px;
  background: #ffffff;
  font-family: 'Playfair Display', serif;
}
.title { font-size: 41px; text-transform: capitalize; color: #2f6fed; }
.sub { font-size: 18px; color: rgba(20, 17, 15, 0.6); margin: 13px 0; }
.card { padding: 20px; gap: 9px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18); }
</style>
</head>
<body>
<section class="page" data-role="hero">
  <h1 class="title">Five Ways To Win At Everything</h1>
  <p class="sub">A thread you did not ask for.</p>
  <div class="card">
    <svg data-icon="rocket" data-size="40"></svg>
    <svg data-icon="fire" data-size="40"></svg>
    <svg data-icon="check" data-size="24"></svg>
    <svg data-icon="spark" data-size="24"></svg>
  </div>
</section>
</body>
</html>
