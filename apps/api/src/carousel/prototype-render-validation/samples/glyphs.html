<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>glyphs</title>
<style>
:root {
  --ds-paper: #faf7f2;
  --ds-ink: #14110f;
  --ds-muted: #5f574e;
  --ds-rule: #d9d0c3;
  --ds-accent: #9c3412;
  --ds-accentInk: #fdf6f2;
}
body { color: var(--ds-ink); font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
.stack { display: flex; flex-direction: column; height: 100%; }
.spacer { flex: 1; }
.label { font-size: 22px; line-height: 1.2; letter-spacing: 0.08em; font-weight: 600; text-transform: uppercase; color: var(--ds-muted); margin: 0; }
.display { font-family: 'Fraunces', Georgia, serif; font-size: 92px; line-height: 1.02; letter-spacing: -0.02em; font-weight: 700; margin: 32px 0 0; }
.heading { font-family: 'Fraunces', Georgia, serif; font-size: 56px; line-height: 1.12; letter-spacing: -0.01em; font-weight: 600; margin: 0; }
.lead { font-size: 34px; line-height: 1.35; margin: 24px 0 0; color: var(--ds-muted); }
.body { font-size: 28px; line-height: 1.5; margin: 48px 0 0; }
.rule { height: 4px; width: 128px; background: var(--ds-accent); margin: 0 0 32px; }
.ask { display: flex; gap: 16px; align-items: center; color: var(--ds-accent); }

</style>
</head>
<body>
<section class="page" data-role="cover">
  <h1 class="display">Ship it 🚀</h1>
  <p class="lead">Namaste is written नमस्ते, and your font has never heard of it.</p>
</section>
<section class="page" data-role="closing">
  <h2 class="heading">Cut one sentence from every page you publish.</h2>
  <p class="label ask"><svg data-icon="arrow-right" data-size="32"></svg> Follow for more field notes</p>
</section>
</body>
</html>
